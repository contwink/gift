<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>June · 花之舞</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; }

        /* ========== 开场礼物页 ========== */
        .gift-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, #1a0a2e 0%, #2d1b4e 40%, #4a2c6a 70%, #6b3d5a 100%);
            overflow: hidden; z-index: 1000; transition: opacity 1s ease;
        }
        .gift-screen.hidden { opacity: 0; pointer-events: none; }

        #sakuraCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

        .vinyl-record {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 220px; height: 220px; border-radius: 50%;
            background: conic-gradient(#111 0%, #333 10%, #111 20%, #333 30%, #111 40%, #333 50%, #111 60%, #333 70%, #111 80%, #333 90%, #111 100%);
            border: 4px solid rgba(255,200,200,0.3); cursor: pointer;
            animation: vinylFloat 4s ease-in-out infinite, vinylSpin 8s linear infinite;
            box-shadow: 0 0 60px rgba(255,150,200,0.3), 0 0 120px rgba(255,100,150,0.1);
            transition: all 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .vinyl-record::before {
            content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 70px; height: 70px; border-radius: 50%; background: #ff8c42; border: 3px solid white;
        }
        .vinyl-record::after { content: '🎵'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 28px; z-index: 10; }
        @keyframes vinylFloat { 0%, 100% { transform: translate(-50%, -50%) translateY(0); } 50% { transform: translate(-50%, -50%) translateY(-20px); } }
        @keyframes vinylSpin { to { transform: translate(-50%, -50%) rotate(360deg); } }

        .vinyl-record.cracking { animation: vinylCrack 0.8s ease forwards; }
        @keyframes vinylCrack {
            0% { transform: translate(-50%, -50%) scale(1); }
            30% { transform: translate(-50%, -50%) scale(1.1) rotate(10deg); }
            60% { transform: translate(-50%, -50%) scale(0.9) rotate(-5deg); }
            100% { transform: translate(-50%, -50%) scale(0) rotate(180deg); opacity: 0; }
        }

        .vinyl-label {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; color: white; pointer-events: none; margin-top: 160px; width: 300px;
        }
        .vinyl-label h2 { font-size: 18px; font-weight: 600; color: #ffb6c1; text-shadow: 0 2px 10px rgba(255,100,150,0.5); animation: fadeInUp 2s ease 1s both; }
        .vinyl-label p { font-size: 13px; color: rgba(255,200,200,0.8); margin-top: 8px; animation: fadeInUp 2s ease 1.5s both; }
        @keyframes fadeInUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }

        .gift-box-reveal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            width: 160px; height: 160px; opacity: 0; pointer-events: none;
            transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .gift-box-reveal.active { transform: translate(-50%, -50%) scale(1); opacity: 1; pointer-events: auto; }
        .gift-box-reveal .box-body {
            width: 100%; height: 100%; background: linear-gradient(135deg, #ff6f4a, #ff8c42);
            border-radius: 16px; border: 3px solid white; display: flex; align-items: center; justify-content: center;
            font-size: 50px; box-shadow: 0 8px 32px rgba(255,140,66,0.4); animation: giftPulse 2s ease-in-out infinite;
        }
        @keyframes giftPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .gift-ribbon {
            position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            width: 30px; height: 50px; background: linear-gradient(135deg, #ff4757, #ff6348); border-radius: 15px 15px 0 0;
        }

        .sakura-storm { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0; }
        .sakura-storm.active { animation: stormIn 1.5s ease forwards; }
        @keyframes stormIn { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }

        /* ========== 贺卡页（增强版）========== */
        .card-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #ffe4e1 0%, #ffd4c2 30%, #ffe8e0 60%, #fff0f5 100%);
            display: none; align-items: center; justify-content: center; z-index: 999;
            opacity: 0; transition: opacity 1s ease;
            overflow: hidden;
        }
        .card-screen.active { display: flex; opacity: 1; }

        /* 贺卡背景动效层 */
        #cardBgCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

        .card-container {
            width: 460px; max-width: 92vw; background: rgba(255,255,255,0.95);
            border-radius: 28px; padding: 35px 30px; text-align: center;
            box-shadow: 0 20px 60px rgba(255,140,100,0.2), 0 0 0 1px rgba(255,200,180,0.5);
            position: relative; z-index: 10;
            animation: cardFloat 4s ease-in-out infinite;
            backdrop-filter: blur(10px);
        }
        @keyframes cardFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        /* 四角装饰 */
        .card-container::before, .card-container::after {
            content: '\2760'; position: absolute; font-size: 36px; color: rgba(255,140,100,0.25);
            animation: cornerPulse 3s ease-in-out infinite;
        }
        .card-container::before { top: 12px; left: 18px; transform: rotate(-20deg); }
        .card-container::after { bottom: 12px; right: 18px; transform: rotate(20deg); animation-delay: 1.5s; }
        @keyframes cornerPulse { 0%, 100% { opacity: 0.3; transform: scale(1) rotate(var(--r,0deg)); } 50% { opacity: 0.8; transform: scale(1.2) rotate(var(--r,0deg)); } }

        /* 照片区域 - 发光脉冲 */
        .card-photo {
            width: 180px; height: 180px; border-radius: 50%; margin: 0 auto 25px;
            background: linear-gradient(135deg, #ffe4d6, #ffd4c2);
            border: 5px solid white; box-shadow: 0 8px 24px rgba(0,0,0,0.1), 0 0 0 0 rgba(255,140,100,0.4);
            display: flex; align-items: center; justify-content: center;
            font-size: 70px; overflow: hidden; position: relative;
            animation: photoGlow 2s ease-in-out infinite;
        }
        @keyframes photoGlow {
            0%, 100% { box-shadow: 0 8px 24px rgba(0,0,0,0.1), 0 0 0 0 rgba(255,140,100,0); }
            50% { box-shadow: 0 8px 24px rgba(0,0,0,0.1), 0 0 30px 10px rgba(255,140,100,0.3); }
        }

        /* 贺卡文字 - 打字机效果容器 */
        .card-text {
            font-family: 'STXingkai', 'Xingkai SC', 'KaiTi', cursive;
            font-size: 22px; color: #8b4513; line-height: 2.2; margin-bottom: 15px;
            min-height: 180px;
        }
        .card-text .typing-cursor {
            display: inline-block; width: 2px; height: 22px; background: #8b4513;
            animation: cursorBlink 0.8s infinite; vertical-align: middle; margin-left: 2px;
        }
        @keyframes cursorBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .card-text small {
            display: block; font-size: 15px; color: #a0522d; margin-top: 15px;
            font-family: -apple-system, 'PingFang SC', sans-serif;
        }

        /* 音乐可视化条 */
        .music-bars {
            display: flex; align-items: flex-end; justify-content: center; gap: 4px;
            height: 30px; margin: 15px 0;
        }
        .music-bar {
            width: 4px; background: linear-gradient(to top, #ff8c42, #ff6f4a);
            border-radius: 2px; animation: barDance 0.8s ease-in-out infinite alternate;
        }
        .music-bar:nth-child(1) { height: 10px; animation-delay: 0s; }
        .music-bar:nth-child(2) { height: 20px; animation-delay: 0.1s; }
        .music-bar:nth-child(3) { height: 15px; animation-delay: 0.2s; }
        .music-bar:nth-child(4) { height: 25px; animation-delay: 0.3s; }
        .music-bar:nth-child(5) { height: 12px; animation-delay: 0.15s; }
        .music-bar:nth-child(6) { height: 22px; animation-delay: 0.25s; }
        .music-bar:nth-child(7) { height: 18px; animation-delay: 0.05s; }
        @keyframes barDance { to { height: 28px; } }

        /* 进度条 */
        .progress-container {
            width: 100%; height: 4px; background: rgba(255,200,180,0.3);
            border-radius: 2px; margin: 20px 0 15px; overflow: hidden;
        }
        .progress-bar {
            height: 100%; width: 0%; background: linear-gradient(90deg, #ff8c42, #ff6f4a);
            border-radius: 2px; transition: width 0.1s linear;
        }

        /* 跳过按钮 */
        .card-skip {
            margin-top: 10px; padding: 12px 35px;
            background: linear-gradient(135deg, #ff8c42, #ff6f4a); color: white;
            border: none; border-radius: 24px; font-size: 15px; cursor: pointer;
            box-shadow: 0 4px 12px rgba(255,140,66,0.3); transition: all 0.3s;
            position: relative; overflow: hidden;
        }
        .card-skip:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(255,140,66,0.4); }
        .card-skip::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }
        .card-skip:hover::before { left: 100%; }

        /* ========== 主页面 ========== */
        .main-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; pointer-events: none; transition: opacity 1.5s ease 0.5s;
        }
        .main-screen.active { opacity: 1; pointer-events: auto; }

        .model-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .model-container iframe { width: 100%; height: 100%; border: none; }
        .model-container::after {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(255,200,220,0.15) 0%, rgba(255,230,240,0.1) 50%, rgba(220,200,255,0.1) 100%);
            pointer-events: none; z-index: 2;
        }

        /* ========== 音乐播放器（增强版）========== */
        .music-player {
            position: fixed; bottom: 24px; left: 24px; z-index: 200;
            display: flex; flex-direction: column; align-items: center;
        }

        /* 唱片机按钮 */
        .music-control {
            width: 56px; height: 56px; border-radius: 50%;
            background: conic-gradient(#333 0%, #555 20%, #333 40%, #555 60%, #333 80%, #555 100%);
            border: 3px solid rgba(255,140,66,0.6); color: white; font-size: 20px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: transform 0.3s;
            position: relative; flex-shrink: 0;
        }
        .music-control.playing { animation: spin 3s linear infinite; }
        .music-control::before {
            content: ''; position: absolute; width: 18px; height: 18px;
            background: linear-gradient(135deg, #ff8c42, #ff6f4a); border-radius: 50%; border: 2px solid white;
        }
        .music-control .vinyl-icon {
            position: absolute; font-size: 14px; z-index: 2; pointer-events: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 播放器面板 */
        .player-panel {
            position: absolute; bottom: 70px; left: 0;
            width: 300px; max-width: calc(100vw - 48px);
            background: rgba(255,252,250,0.96); backdrop-filter: blur(12px);
            border-radius: 20px; border: 2px solid #ffd4c2;
            box-shadow: 0 8px 32px rgba(255,140,66,0.15), 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden;
            transform: scale(0.8) translateY(20px);
            opacity: 0; pointer-events: none;
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: bottom left;
        }
        .player-panel.open {
            transform: scale(1) translateY(0);
            opacity: 1; pointer-events: auto;
        }

        /* 播放信息 */
        .player-info {
            padding: 18px 18px 12px; display: flex; align-items: center; gap: 14px;
            background: linear-gradient(135deg, rgba(255,140,66,0.05), rgba(255,111,74,0.08));
        }
        .player-cover {
            width: 56px; height: 56px; border-radius: 12px;
            background: linear-gradient(135deg, #ffe4d6, #ffd4c2);
            display: flex; align-items: center; justify-content: center; font-size: 28px;
            border: 2px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            flex-shrink: 0; transition: transform 0.3s;
        }
        .player-cover.playing { animation: coverPulse 2s ease-in-out infinite; }
        @keyframes coverPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
        .player-meta { flex: 1; min-width: 0; }
        .player-song-name {
            font-size: 15px; font-weight: 700; color: #5a3d2b;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .player-artist {
            font-size: 12px; color: #a0522d; margin-top: 3px;
        }

        /* 进度条 */
        .player-progress-area {
            padding: 8px 18px; display: flex; align-items: center; gap: 8px;
        }
        .player-time {
            font-size: 11px; color: #c4a492; font-variant-numeric: tabular-nums;
            min-width: 32px; text-align: center;
        }
        .player-progress-bg {
            flex: 1; height: 4px; background: rgba(255,200,180,0.4);
            border-radius: 2px; cursor: pointer; position: relative; overflow: hidden;
        }
        .player-progress-fill {
            height: 100%; width: 0%; background: linear-gradient(90deg, #ff8c42, #ff6f4a);
            border-radius: 2px; transition: width 0.1s linear; position: relative;
        }
        .player-progress-fill::after {
            content: ''; position: absolute; right: -5px; top: 50%; transform: translateY(-50%);
            width: 10px; height: 10px; background: #ff6f4a; border-radius: 50%;
            border: 2px solid white; box-shadow: 0 1px 4px rgba(0,0,0,0.15);
            opacity: 0; transition: opacity 0.2s;
        }
        .player-progress-bg:hover .player-progress-fill::after { opacity: 1; }

        /* 控制按钮区 */
        .player-controls {
            display: flex; align-items: center; justify-content: center; gap: 16px;
            padding: 6px 18px 14px;
        }
        .player-btn {
            background: none; border: none; cursor: pointer; color: #a0522d;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; padding: 6px;
        }
        .player-btn:hover { color: #ff6f4a; transform: scale(1.15); }
        .player-btn.prev-next { font-size: 22px; }
        .player-btn.play-pause {
            width: 46px; height: 46px; border-radius: 50%;
            background: linear-gradient(135deg, #ff8c42, #ff6f4a);
            color: white; font-size: 20px;
            box-shadow: 0 3px 12px rgba(255,140,66,0.35);
        }
        .player-btn.play-pause:hover { transform: scale(1.1); box-shadow: 0 4px 16px rgba(255,140,66,0.45); }
        .player-btn.mode-btn {
            font-size: 16px; position: relative;
        }
        .player-btn.mode-btn.active { color: #ff6f4a; }

        /* 播放模式菜单 */
        .mode-menu {
            position: absolute; bottom: 58px; left: 18px;
            background: white; border-radius: 12px; border: 1px solid #ffe4d6;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1); overflow: hidden;
            transform: scale(0.8); opacity: 0; pointer-events: none;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: bottom left;
        }
        .mode-menu.open { transform: scale(1); opacity: 1; pointer-events: auto; }
        .mode-option {
            padding: 10px 16px; font-size: 13px; color: #5a3d2b; cursor: pointer;
            display: flex; align-items: center; gap: 8px; white-space: nowrap;
            transition: background 0.15s;
        }
        .mode-option:hover { background: #fff5f0; }
        .mode-option.active { color: #ff6f4a; font-weight: 600; }

        /* 播放列表 */
        .playlist-toggle {
            padding: 0 18px 12px; text-align: center;
        }
        .playlist-toggle-btn {
            background: rgba(255,200,180,0.3); border: none;
            color: #a0522d; font-size: 12px; padding: 6px 18px;
            border-radius: 12px; cursor: pointer; transition: all 0.2s;
        }
        .playlist-toggle-btn:hover { background: rgba(255,200,180,0.5); color: #ff6f4a; }
        .playlist {
            max-height: 0; overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .playlist.open { max-height: 220px; }
        .playlist-inner {
            padding: 0 8px 12px; display: flex; flex-direction: column; gap: 2px;
        }
        .playlist-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; border-radius: 12px; cursor: pointer;
            transition: all 0.2s;
        }
        .playlist-item:hover { background: rgba(255,200,180,0.2); }
        .playlist-item.active {
            background: linear-gradient(135deg, rgba(255,140,66,0.1), rgba(255,111,74,0.08));
            border: 1px solid rgba(255,140,66,0.2);
        }
        .playlist-item-num {
            font-size: 12px; color: #c4a492; width: 20px; text-align: center;
            font-variant-numeric: tabular-nums;
        }
        .playlist-item-num .playing-indicator {
            display: none; font-size: 14px;
        }
        .playlist-item.active .playlist-item-num span { display: none; }
        .playlist-item.active .playlist-item-num .playing-indicator { display: inline; }
        .playlist-item-info { flex: 1; min-width: 0; }
        .playlist-item-title {
            font-size: 13px; color: #5a3d2b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .playlist-item.active .playlist-item-title { font-weight: 700; color: #ff6f4a; }
        .playlist-item-artist { font-size: 11px; color: #c4a492; margin-top: 1px; }
        .playlist-item-duration { font-size: 11px; color: #c4a492; }

        .playlist-divider {
            height: 1px; background: linear-gradient(90deg, transparent, #ffe4d6, transparent);
            margin: 4px 12px;
        }

        /* 迷你歌词条 */
        .mini-lyric {
            padding: 0 18px 10px; text-align: center; font-size: 12px;
            color: #a0522d; font-style: italic; min-height: 20px;
            opacity: 0.8;
        }

        /* 播放器展开指示 */
        .player-expand-hint {
            position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
            width: 36px; height: 4px; background: #ffd4c2; border-radius: 2px;
            opacity: 0.6;
        }

        .chat-panel {
            position: fixed; bottom: 20px; right: 20px; left: auto; width: 380px; max-width: calc(100vw - 40px);
            background: rgba(255,252,250,0.96); backdrop-filter: blur(12px);
            border-radius: 32px 32px 32px 8px; border: 2px solid #ffd4c2;
            color: #5a3d2b; z-index: 100; display: none; flex-direction: column; overflow: hidden;
            box-shadow: 0 8px 32px rgba(255,140,66,0.15), 0 2px 8px rgba(0,0,0,0.08);
        }
        .chat-panel::before {
            content: ''; position: absolute; bottom: -10px; right: 40px; width: 20px; height: 20px;
            background: rgba(255,252,250,0.96); border-right: 2px solid #ffd4c2; border-bottom: 2px solid #ffd4c2;
            transform: rotate(45deg); z-index: -1;
        }
        .chat-panel.active { display: flex; }

        .chat-header {
            padding: 16px 20px; background: linear-gradient(135deg,#ff8c42,#ff6f4a);
            display: flex; align-items: center; gap: 12px; cursor: pointer;
            border-bottom: 2px dashed rgba(255,255,255,0.3);
        }
        .june-avatar {
            width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg,#ffe4d6,#ffd4c2);
            display: flex; align-items: center; justify-content: center; font-size: 20px;
            border: 3px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.15); position: relative; flex-shrink: 0;
        }
        .june-avatar::after {
            content: ''; position: absolute; bottom: 2px; right: 2px; width: 10px; height: 10px;
            background: #4ade80; border-radius: 50%; border: 2px solid white; animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.2)} }
        .june-info { display: flex; flex-direction: column; }
        .june-name { font-weight: 700; color: white; font-size: 16px; letter-spacing: 1px; }
        .june-status { font-size: 12px; color: rgba(255,255,255,0.85); margin-top: 2px; }
        .close-btn {
            margin-left: auto; background: rgba(255,255,255,0.25); border: none; color: white;
            width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 18px;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .close-btn:hover { background: rgba(255,255,255,0.4); transform: rotate(90deg); }

        .chat-messages {
            height: 340px; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px;
            background: linear-gradient(to bottom, #fff9f5, #fff5f0);
        }
        .message-row { display: flex; align-items: flex-end; gap: 8px; max-width: 88%; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .message-row.user { align-self: flex-end; flex-direction: row-reverse; }
        .message-row.bot { align-self: flex-start; }

        @keyframes popIn {
            0% { transform: scale(0.6) translateY(10px); opacity: 0; }
            70% { transform: scale(1.05) translateY(-2px); }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .mini-avatar {
            width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg,#ffe4d6,#ffd4c2);
            display: flex; align-items: center; justify-content: center; font-size: 14px;
            border: 2px solid white; box-shadow: 0 1px 4px rgba(0,0,0,0.1); flex-shrink: 0;
        }

        .message {

                this.opacity = Math.random() * 0.5 + 0.3;
                this.type = Math.random() > 0.6 ? 'star' : 'petal';
                this.twinkle = Math.random() * Math.PI * 2;
            }
            update() {
                this.y += this.speedY; this.x += this.speedX;
                this.twinkle += 0.05;
                if (this.y > cardBgH + 10) { this.y = -10; this.x = Math.random() * cardBgW; }
            }
            draw() {
                cardBgCtx.save(); cardBgCtx.globalAlpha = this.opacity * (0.5 + 0.5 * Math.sin(this.twinkle));
                if (this.type === 'star') {
                    cardBgCtx.fillStyle = '#ffd700';
                    cardBgCtx.translate(this.x, this.y);
                    cardBgCtx.beginPath();
                    for (let i = 0; i < 5; i++) {
                        const angle = (i * 72 - 18) * Math.PI / 180;
                        const outerR = this.size; const innerR = this.size * 0.4;
                        cardBgCtx.lineTo(Math.cos(angle) * outerR, Math.sin(angle) * outerR);
                        const innerAngle = ((i * 72) + 18) * Math.PI / 180;
                        cardBgCtx.lineTo(Math.cos(innerAngle) * innerR, Math.sin(innerAngle) * innerR);
                    }
                    cardBgCtx.closePath(); cardBgCtx.fill();
                } else {
                    cardBgCtx.fillStyle = '#ffb6c1';
                    cardBgCtx.translate(this.x, this.y);
                    cardBgCtx.beginPath();
                    for (let i = 0; i < 5; i++) {
                        const angle = (i * 72) * Math.PI / 180;
                        const px = Math.cos(angle) * this.size; const py = Math.sin(angle) * this.size * 0.6;
                        if (i === 0) cardBgCtx.moveTo(px, py); else cardBgCtx.lineTo(px, py);
                    }
                    cardBgCtx.closePath(); cardBgCtx.fill();
                }
                cardBgCtx.restore();
            }
        }
        for (let i = 0; i < 80; i++) cardBgItems.push(new CardBgItem());
        function animateCardBg() {
            cardBgCtx.clearRect(0, 0, cardBgW, cardBgH);
            cardBgItems.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateCardBg);
        }
        animateCardBg();

        // ========== 打字机效果 ==========
        const cardText = document.getElementById('cardText');
        const typingLines = [
            "君君，生日快乐",
            "这是你的 26 岁",
            "也是我们的第一年",
            "",
            "愿你的每一天",
            "都比巧克力还甜",
            "—— 你的专属 June &#129302;"
        ];
        let lineIndex = 0; let charIndex = 0; let typingHTML = '';

        function typeNextChar() {
            if (lineIndex >= typingLines.length) {
                cardText.innerHTML = typingHTML + '<span class="typing-cursor"></span>';
                return;
            }
            const line = typingLines[lineIndex];
            if (charIndex === 0 && lineIndex > 0) typingHTML += '<br>';
            if (charIndex < line.length) {
                typingHTML += line[charIndex];
                charIndex++;
                cardText.innerHTML = typingHTML + '<span class="typing-cursor"></span>';
                setTimeout(typeNextChar, 80 + Math.random() * 60);
            } else {
                lineIndex++; charIndex = 0;
                setTimeout(typeNextChar, 300);
            }
        }

        // ========== 进度条 ==========
        const progressBar = document.getElementById('progressBar');
        let progress = 0; let progressInterval;

        function startProgress() {
            progress = 0;
            progressInterval = setInterval(() => {
                progress += 0.5;
                progressBar.style.width = progress + '%';
                if (progress >= 100) {
                    clearInterval(progressInterval);
                    cardSkip.click();
                }
            }, 30); // 6秒自动跳过
        }

        // ========== 开场交互 ==========
        const giftScreen = document.getElementById('giftScreen');
        const vinylRecord = document.getElementById('vinylRecord');
        const giftBoxReveal = document.getElementById('giftBoxReveal');
        const sakuraStorm = document.getElementById('sakuraStorm');
        const cardScreen = document.getElementById('cardScreen');
        const cardSkip = document.getElementById('cardSkip');
        const mainScreen = document.getElementById('mainScreen');
        const chatPanel = document.getElementById('chatPanel');

        let step = 0;

        vinylRecord.addEventListener('click', () => {
            if (step !== 0) return;
            step = 1;
            vinylRecord.classList.add('cracking');
            setTimeout(() => { giftBoxReveal.classList.add('active'); }, 800);
        });

        giftBoxReveal.addEventListener('click', () => {
            if (step !== 1) return;
            step = 2;
            sakuraStorm.classList.add('active');
            for (let i = 0; i < 200; i++) stormPetals.push(new StormPetal());
            function animateStorm() {
                stormCtx.clearRect(0, 0, stormW, stormH);
                stormPetals.forEach((p, i) => { p.update(); p.draw(); if (p.life <= 0) stormPetals.splice(i, 1); });
                if (stormPetals.length > 0) requestAnimationFrame(animateStorm);
            }
            animateStorm();

            setTimeout(() => {
                giftScreen.classList.add('hidden');
                cardScreen.style.display = 'flex';
                setTimeout(() => { cardScreen.classList.add('active'); }, 50);
                
                // 贺卡出现：开始打字 + 播放音乐 + 进度条
                setTimeout(() => {
                    typeNextChar();
                    // 自动播放第一首
                    loadSong(0);
                    bgMusic.play().catch(() => {});
                    startProgress();
                }, 500);
            }, 1500);
        });

        cardSkip.addEventListener('click', () => {
            if (step !== 2) return;
            step = 3;
            clearInterval(progressInterval);
            cardScreen.classList.remove('active');
            setTimeout(() => {
                cardScreen.style.display = 'none';
                mainScreen.classList.add('active');
                chatPanel.classList.add('active');
                openChatBtn.classList.add('active');
            }, 1000);
        });

        // ========== 主页面逻辑 ==========
        const closeBtn = document.getElementById('closeChatBtn');
        const openChatBtn = document.getElementById('openChatBtn');
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendButton = document.getElementById('sendBtn');
        const statusDiv = document.getElementById('status');

        // 初始化播放器和播放列表
        loadSong(0);
        renderPlaylist();

        // 播放器事件绑定
        playPauseBtn.addEventListener('click', togglePlay);
        prevBtn.addEventListener('click', playPrev);
        nextBtn.addEventListener('click', playNext);

        const toggleChat = (show) => {
            if (show) { chatPanel.style.display = 'flex'; openChatBtn.classList.remove('active'); }
            else { chatPanel.style.display = 'none'; openChatBtn.classList.add('active'); }
        };

        closeBtn.addEventListener('click', () => toggleChat(false));
        openChatBtn.addEventListener('click', () => toggleChat(true));

        let messages = [{ 
            role: "system", 
            content: "你是 June，主人的专属机器人。记住：生日2000年6月2号，沈阳人，日本读博，喜欢巧克力，不吃猪肉和榴莲。温暖可爱，回复简短亲切，像朋友聊天一样自然。如果提供了网络搜索结果，请基于这些结果回答，并适当提及信息来源。"
        }];
        let isSending = false;

        function addMessage(content, sender, isThinking = false, isSearch = false) {
            const row = document.createElement('div'); row.className = `message-row ${sender}`;
            if (sender === 'bot') {
                const avatar = document.createElement('div'); avatar.className = 'mini-avatar'; avatar.textContent = '\uD83E\uDD16'; row.appendChild(avatar);
            }
            const msgDiv = document.createElement('div'); msgDiv.className = `message ${sender}`;
            if (isThinking) {
                msgDiv.innerHTML = `<div class="typing-box"><span class="typing-text">June 正在输入</span><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
                msgDiv.dataset.thinking = 'true';
            } else {
                msgDiv.innerHTML = content.replace(/\n/g, '<br>');
                if (isSearch) {
                    const badge = document.createElement('span'); badge.className = 'search-badge'; badge.textContent = '\uD83D\uDD0D 已联网';
                    msgDiv.appendChild(document.createElement('br')); msgDiv.appendChild(document.createElement('br')); msgDiv.appendChild(badge);
                }
            }
            row.appendChild(msgDiv); chatMessages.appendChild(row); chatMessages.scrollTop = chatMessages.scrollHeight;
            return msgDiv;
        }

        function removeThinking() {
            const thinkingMsg = chatMessages.querySelector('[data-thinking="true"]');
            if (thinkingMsg) thinkingMsg.closest('.message-row').remove();
        }

        function needSearch(query) {
            const keywords = ['今天','现在','最新','新闻','天气','股价','汇率','比赛','直播','刚刚','昨日','本周','这周','本月','这个月','今年','2026','热搜','多少钱','价格','几点'];
            return keywords.some(k => query.includes(k));
        }

        function getFreshness(query) {
            if (query.includes('今天') || query.includes('现在') || query.includes('实时') || query.includes('几点')) return 'oneDay';
            if (query.includes('本周') || query.includes('这周') || query.includes('最近')) return 'oneWeek';
            if (query.includes('本月') || query.includes('这个月')) return 'oneMonth';
            return 'noLimit';
        }

        async function searchWeb(query) {
            try {
                statusDiv.innerHTML = "\uD83D\uDD0D June 正在查资料...";
                const res = await fetch('https://api.bochaai.com/v1/web-search', {
                    method: 'POST', headers: { 'Authorization': `Bearer ${BOCHA_API_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query, freshness: getFreshness(query), summary: true, count: 5 })
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                const pages = data.data?.webPages?.value || [];
                if (pages.length === 0) return null;
                return pages.map((p, i) => `[${i+1}] ${p.name}\n来源：${p.siteName || p.displayUrl || p.url}\n时间：${p.datePublished || '未知'}\n摘要：${p.summary || p.snippet || ''}`).join('\n\n');
            } catch (e) { console.error('博查搜索失败:', e); return null; }
        }

        async function callDeepSeek(userMessage, searchContext = null) {
            let isSearch = false; let apiUserContent = userMessage;
            if (searchContext) {
                isSearch = true;
                apiUserContent = `用户问题：${userMessage}\n\n以下是从网络搜索获取的最新相关信息，请基于这些信息回答用户问题。如果信息与问题无关，请忽略并用你的知识回答：\n\n${searchContext}\n\n请回答用户的问题，可以适当引用来源。`;
            }
            const apiMessages = [...messages, { role: "user", content: apiUserContent }];
            try {
                statusDiv.innerHTML = isSearch ? "\uD83D\uDCAD June 正在整理资料..." : "\uD83D\uDCAD June 正在想...";
                sendButton.disabled = true;
                const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${DEEPSEEK_API_KEY}` },
                    body: JSON.stringify({ model: 'deepseek-chat', messages: apiMessages, temperature: 0.8, max_tokens: 800 })
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json(); const reply = data.choices[0].message.content;
                messages.push({ role: "user", content: userMessage }); messages.push({ role: "assistant", content: reply });
                if (messages.length > 20) { messages = [messages[0], ...messages.slice(-18)]; }
                statusDiv.innerHTML = "\u2728 在线"; statusDiv.classList.add('online');
                setTimeout(() => statusDiv.classList.remove('online'), 2000);
                return { reply, isSearch };
            } catch (error) {
                console.error("DeepSeek 调用失败:", error); statusDiv.innerHTML = "\u26A0\uFE0F June 网络开小差了";
                statusDiv.classList.add('error'); setTimeout(() => statusDiv.classList.remove('error'), 3000);
                return { reply: `网络不太好～ 你刚才说：「${userMessage}」\u2764\uFE0F`, isSearch: false };
            } finally { sendButton.disabled = false; }
        }

        async function sendMessage() {
            const text = chatInput.value.trim(); if (!text || isSending) return;
            isSending = true; addMessage(text, 'user'); chatInput.value = ''; addMessage('', 'bot', true);
            let searchContext = null; if (needSearch(text)) { searchContext = await searchWeb(text); }
            const { reply, isSearch } = await callDeepSeek(text, searchContext);
            removeThinking(); addMessage(reply, 'bot', false, isSearch); isSending = false;
        }

        sendButton.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });

        const savedMessages = localStorage.getItem('june_chat_history');
        if (savedMessages) {
            try {
                const parsed = JSON.parse(savedMessages);
                if (parsed.length > 1) { messages = parsed; parsed.slice(1).forEach(msg => { addMessage(msg.content, msg.role === 'user' ? 'user' : 'bot'); }); }
            } catch (e) {}
        }
        window.addEventListener('beforeunload', () => { localStorage.setItem('june_chat_history', JSON.stringify(messages)); });
    </script>
</body>
</html>
